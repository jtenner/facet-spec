name: Facet WAST API coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate direct WAST API declaration and invocation coverage
        run: |
          python3 -m unittest discover -s spec/tests/tools -p 'test_*.py'
          python3 spec/tests/tools/check_suite.py
          python3 spec/tests/tools/report_import_coverage.py
