name: Facet WAST import declarations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/conformance-dir-iterate-rewind]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate suite and report direct WAST import declarations
        run: |
          python3 spec/tests/tools/check_suite.py
          python3 spec/tests/tools/report_import_coverage.py
