name: Remove WPSI scratch ABI

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/remove_scratch_abi.py"
      - ".github/workflows/remove-scratch-abi.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Apply scratch ABI migration
        run: python3 .github/scripts/remove_scratch_abi.py

      - name: Regenerate conformance catalog
        run: python3 spec/tests/tools/generate_suite.py

      - name: Validate static suite
        run: python3 spec/tests/tools/check_suite.py

      - name: Install pinned wasm-tools
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.256.0/wasm-tools-1.256.0-x86_64-linux.tar.gz \
            --output /tmp/wasm-tools.tar.gz
          echo "0b488be25c9e8a74dfa09f7eac614a927ea197f389d8fa5a21ffb1c15deb469d  /tmp/wasm-tools.tar.gz" | sha256sum --check
          tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
          sudo install /tmp/wasm-tools-1.256.0-x86_64-linux/wasm-tools /usr/local/bin/wasm-tools

      - name: Parse canonical imports
        run: wasm-tools parse spec/imports.wat -o /tmp/wpsi-imports.wasm

      - name: Parse every WAST source
        run: python3 spec/tests/tools/parse_wast.py

      - name: Remove migration machinery
        run: |
          rm .github/scripts/remove_scratch_abi.py
          rm .github/workflows/remove-scratch-abi.yml

      - name: Commit migration
        shell: bash
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "spec: model guest home as ordinary optional preopen"
          git push
