name: Final WPSI text cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-text-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Clean normative text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          behavior = Path('spec/behavior.md')
          text = behavior.read_text()
          text = text.replace(
              '4. **Guest representation.** Resolve the selected linear memory or GC reference and validate the expected address width, GC array kind, dynamic element storage type, destination mutability, and any caller-selected concrete GC allocation result type.',
              '4. **Guest representation.** Resolve the selected linear memory or GC reference and validate the expected address width, GC array kind, dynamic element storage type, and destination mutability.'
          )
          text = text.replace(
              '| `ERR_TYPE` | Guest representation has the wrong physical type, such as Memory64 passed to a `_mem32` operation, wrong GC element storage, immutable GC storage used as a destination, . |',
              '| `ERR_TYPE` | Guest representation has the wrong physical type, such as Memory64 passed to a `_mem32` operation, wrong GC element storage, or immutable GC storage used as a destination. |'
          )
          text = text.replace(
              '- whether path encoding should ever move from an ordinary enum parameter into representation-specific import names.\n',
              ''
          )
          behavior.write_text(text)

          design = Path('docs/design.md')
          text = design.read_text().replace('\n\n\n## Why a WTF boolean', '\n\n## Why a WTF boolean')
          design.write_text(text)
          PY

      - name: Validate static suite
        run: python3 spec/tests/tools/check_suite.py

      - name: Remove cleanup workflow
        run: rm .github/workflows/final-text-cleanup.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: finish WTF text model cleanup"
          git push
