name: Set facet import namespace

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Update Core Wasm import namespace
        run: python3 .github/scripts/rename_to_facets.py

      - name: Regenerate conformance catalog
        run: python3 spec/tests/tools/generate_suite.py

      - name: Validate static suite
        run: python3 spec/tests/tools/check_suite.py

      - name: Check documentation accessibility
        run: python3 spec/tests/tools/check_docs.py

      - name: Install pinned wasm-tools
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.256.0/wasm-tools-1.256.0-x86_64-linux.tar.gz \
            --output /tmp/wasm-tools.tar.gz
          echo "0b488be25c9e8a74dfa09f7eac614a927ea197f389d8fa5a21ffb1c15deb469d  /tmp/wasm-tools.tar.gz" | sha256sum --check
          tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
          sudo install /tmp/wasm-tools-1.256.0-x86_64-linux/wasm-tools /usr/local/bin/wasm-tools

      - name: Parse canonical import declarations
        run: wasm-tools parse spec/imports.wat -o /tmp/facet-imports.wasm

      - name: Parse every WAST source
        run: python3 spec/tests/tools/parse_wast.py

      - name: Remove migration machinery
        run: |
          rm .github/scripts/rename_to_facets.py
          rm .github/workflows/rename-facets.yml

      - name: Commit facet namespace
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "spec: use facet import namespace"
          git push origin HEAD:${{ github.head_ref }}
