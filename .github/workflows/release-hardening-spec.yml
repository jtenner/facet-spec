name: Facet release hardening generator

on:
  push:
    branches:
      - agent/facet-0.1-release-semantics

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/facet-0.1-release-semantics
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Apply release-hardening changes
        run: python3 .release_hardening_spec.py
      - name: Validate generated conformance sources
        run: python3 spec/tests/tools/check_suite.py
      - name: Check generated diff
        run: git diff --check
      - name: Commit generated release-hardening changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "spec: freeze Facet 0.1 release semantics"
          git push origin HEAD:agent/facet-0.1-release-semantics
