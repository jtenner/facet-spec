name: Resolve WPSI handle encoding

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/resolve-handle-encoding.yml"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Apply handle encoding decision
        run: python3 .github/scripts/resolve_handle_encoding.py

      - name: Validate static conformance metadata
        run: python3 spec/tests/tools/check_suite.py

      - name: Remove temporary migration machinery
        run: |
          rm .github/scripts/resolve_handle_encoding.py
          rm .github/workflows/resolve-handle-encoding.yml

      - name: Commit resolved handle semantics
        shell: bash
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "spec: make handle encoding runtime-private"
          git push
