name: Bootstrap validated WPSI conformance suite

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/bootstrap_wpsi_final.py"
      - ".github/scripts/wpsi-final.part*"
      - ".github/workflows/bootstrap-suite.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install staged suite sources
        run: python3 .github/scripts/bootstrap_wpsi_final.py

      - name: Check generated catalog
        run: python3 spec/tests/tools/generate_suite.py --check

      - name: Validate catalog, manifests, fixtures, and import signatures
        run: python3 spec/tests/tools/check_suite.py

      - name: Install pinned wasm-tools
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.256.0/wasm-tools-1.256.0-x86_64-linux.tar.gz \
            --output /tmp/wasm-tools.tar.gz
          echo "0b488be25c9e8a74dfa09f7eac614a927ea197f389d8fa5a21ffb1c15deb469d  /tmp/wasm-tools.tar.gz" | sha256sum --check
          tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
          sudo install /tmp/wasm-tools-1.256.0-x86_64-linux/wasm-tools /usr/local/bin/wasm-tools

      - name: Parse every WAST source
        run: python3 spec/tests/tools/parse_wast.py

      - name: Commit the reviewable suite sources
        shell: bash
        run: |
          git add -A -- README.md CHANGELOG.md CONTRIBUTING.md tests/README.md spec/tests
          if git diff --cached --quiet; then
            echo "The WPSI conformance suite is already installed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: add comprehensive WPSI conformance suite"
          git push
